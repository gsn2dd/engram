name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: pathmemoria
          POSTGRES_USER: pathuser
          POSTGRES_PASSWORD: pathpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        # pytest is a TEST dependency and deliberately not in requirements.txt,
        # which is installed into the container image — the runtime has no
        # business carrying a test runner. Capped by major like everything in
        # that file, for the reason recorded at the top of it.
        run: |
          pip install -r requirements.txt
          pip install "pytest>=7.0,<9.0"

      - name: Apply schema
        env:
          PGPASSWORD: pathpass
        run: psql -h localhost -U pathuser -d pathmemoria -f schema.sql

      - name: Import check
        run: python3 -c "from path_memory import Memory, recall, run_decay; print('imports OK')"

      - name: Smoke test (no API keys)
        env:
          DB_NAME: pathmemoria
          DB_USER: pathuser
          DB_PASS: pathpass
          DB_HOST: localhost
        run: |
          python3 -c "
          import sys; sys.path.insert(0,'.')
          from path_memory.db import get_conn
          conn = get_conn()
          cur = conn.cursor()
          cur.execute(\"INSERT INTO memories (person, subject, body) VALUES ('test', 'ci test', 'smoke test body') RETURNING id\")
          mid = cur.fetchone()[0]
          conn.commit()
          cur.execute('SELECT id, subject FROM memories WHERE id = %s', (mid,))
          row = cur.fetchone()
          assert row[1] == 'ci test', f'Expected ci test, got {row[1]}'
          cur.execute('DELETE FROM memories WHERE id = %s', (mid,))
          conn.commit()
          cur.close(); conn.close()
          print(f'DB smoke test passed (id={mid})')
          "

      - name: Unit tests
        # Temporal tests run anywhere; the feature tests (perspectives / project
        # scoping / distillation) need OPENAI_API_KEY + ANTHROPIC_API_KEY and
        # skip automatically when they're absent (as they are in CI).
        #
        # PYTEST, NOT `unittest discover`. tests/conftest.py builds an ephemeral
        # database per run and claims "no test can touch a real brain, however
        # badly written it is" — but conftest is a pytest mechanism, so under
        # unittest that protection silently does not exist. CI was therefore
        # running the suite with the guarantee its own tests document turned
        # off, and so was anyone who ran unittest on a machine whose DB_* point
        # at a live brain. Running pytest here also means schema.sql's
        # FRESH-INSTALL path is exercised on every CI run, which is the other
        # half of what conftest was written for.
        env:
          DB_NAME: pathmemoria
          DB_USER: pathuser
          DB_PASS: pathpass
          DB_HOST: localhost
        run: python3 -m pytest tests -v
